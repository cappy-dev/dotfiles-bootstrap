# tmux.conf - sensible defaults

# Change prefix to Ctrl+a (easier on keyboard)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Mouse support
set -g mouse on

# 256 colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Fast escape (no delay for vim)
set -sg escape-time 0

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config with r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Switch panes with Alt+arrow (no prefix)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Shift+arrow
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 2
bind -n S-Down resize-pane -D 2

# Status bar
set -g status-style bg=black,fg=white
set -g status-interval 5
set -g status-left-length 30
set -g status-left '#[fg=cyan]#S '
set -g status-right '#[fg=yellow]%H:%M %Y-%m-%d'
